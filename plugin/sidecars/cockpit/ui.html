<!doctype html>
<html lang="en" data-theme="dark" data-follow-host="true">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plugin Porter</title>
<!-- Loaded first, so the host's one-shot theme-change isn't missed (as in the mod runtime). -->
<script src="/preload.js"></script>
<!-- The host's stylesheet and theme tokens, then sidecar-kit's native components, as Hangar and context-monitor load them. -->
<link rel="stylesheet" href="/compiled_tailwind.css">
<link rel="stylesheet" href="/shell.css">
<link rel="stylesheet" href="/agy-ui.css">
<link rel="stylesheet" href="/ui.css">
<script defer src="/shell.js"></script>
<script defer src="/agy-ui.js"></script>
<script defer src="/ui.js"></script>
</head>
<body>
<main class="cockpit">
  <header class="cockpit-head">
    <h1>Plugin Porter</h1>
    <p>Port a Claude Code, Gemini CLI, Cursor, Roo/Kilo or Codex plugin into Antigravity.</p>
  </header>

  <form id="form" class="agy-card cockpit-form" aria-label="New port">
    <div id="fields" class="cockpit-fields"></div>
    <div class="cockpit-actions">
      <button id="preview" type="submit" class="agy-btn agy-btn-primary">Preview</button>
    </div>
  </form>

  <div id="status" class="agy-banner hidden" role="status" aria-live="polite"></div>

  <section id="report" class="agy-card cockpit-report" aria-label="Port report" hidden></section>

  <section class="agy-card cockpit-recent" aria-labelledby="recent-title">
    <div class="agy-card-section-bar"><span id="recent-title">Recent previews</span><span id="recent-count"></span></div>
    <div id="recent"></div>
  </section>
</main>
</body>
</html>
