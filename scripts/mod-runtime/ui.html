<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ported mod</title>
<!-- Loaded first, like science's view, so the host's one-shot theme-change isn't missed.
     preload.js reads the token from this page's URL, so its own URL needs none. -->
<script src="/preload.js"></script>
<link rel="stylesheet" href="/compiled_tailwind.css">
<style>
  :root {
    --app-font-scale: 1;
    --bg: var(--background, #f9f9fb);
    --surface: var(--card, #ffffff);
    --fg: var(--foreground, #18181b);
    --dim: var(--muted-foreground, #6b6b76);
    --line: var(--card-border, var(--border, rgba(0, 0, 0, 0.08)));
    --accent: var(--primary, #2f71e3);
    --accent-fg: var(--primary-foreground, #ffffff);
    --cyan: #0e7490; --green: #15803d; --red: #dc2626; --yellow: #a16207; --magenta: #a21caf; --blue: #2f71e3;
  }
  :root[data-theme="dark"] {
    --bg: var(--background, #070708);
    --surface: var(--card, #121215);
    --fg: var(--foreground, #ffffff);
    --dim: var(--muted-foreground, #8e8e98);
    --line: var(--card-border, var(--border, rgba(255, 255, 255, 0.08)));
    --accent: var(--primary, #2f71e3);
    --accent-fg: var(--primary-foreground, #ffffff);
    --cyan: #22d3ee; --green: #4ade80; --red: #f87171; --yellow: #facc15; --magenta: #e879f9; --blue: #60a5fa;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: var(--background, #070708);
      --surface: var(--card, #121215);
      --fg: var(--foreground, #ffffff);
      --dim: var(--muted-foreground, #8e8e98);
      --line: var(--card-border, var(--border, rgba(255, 255, 255, 0.08)));
      --accent: var(--primary, #2f71e3);
      --accent-fg: var(--primary-foreground, #ffffff);
      --cyan: #22d3ee; --green: #4ade80; --red: #f87171; --yellow: #facc15; --magenta: #e879f9; --blue: #60a5fa;
    }
  }
  body {
    font-family: var(--font-sans, system-ui, -apple-system, sans-serif);
    font-size: var(--text-compact, calc(var(--app-font-scale, 1) * 0.8125rem));
    line-height: 1.5;
    margin: 0;
    background: var(--bg);
    color: var(--fg);
  }
  header { display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-start; padding: 8px 12px; border-bottom: 0.5px solid var(--line); background: var(--surface); }
  header .cmd { display: inline-flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  header .cmd label { color: var(--dim); font-size: var(--text-sm, calc(var(--app-font-scale, 1) * 0.75rem)); }
  header .cmd input { width: 9em; }
  header .cmd .help { color: var(--dim); font-size: var(--text-xs, calc(var(--app-font-scale, 1) * 0.6875rem)); width: 100%; }
  #strips > div { padding: 6px 12px; border-bottom: 0.5px solid var(--line); }
  nav { display: flex; gap: 4px; padding: 0 12px; border-bottom: 0.5px solid var(--line); }
  nav button { border: 0; background: none; color: var(--dim); padding: 6px 8px; cursor: pointer; font-size: var(--text-sm, calc(var(--app-font-scale, 1) * 0.75rem)); }
  nav button.on { color: var(--fg); border-bottom: 2px solid var(--accent); font-weight: 500; }
  nav .x { margin-left: 2px; opacity: .6; }
  main { padding: 12px; }
  footer { position: sticky; bottom: 0; padding: 6px 12px; border-top: 0.5px solid var(--line); color: var(--dim); background: var(--bg); min-height: 1.4em; font-size: var(--text-xs, calc(var(--app-font-scale, 1) * 0.6875rem)); }
  #toasts { position: fixed; right: 12px; bottom: 36px; display: flex; flex-direction: column; gap: 6px; max-width: 80%; }
  .toast { background: var(--surface); color: var(--fg); border: 0.5px solid var(--line); padding: 6px 10px; border-radius: 8px; font-size: var(--text-sm, calc(var(--app-font-scale, 1) * 0.75rem)); }
  .empty { color: var(--dim); padding: 20px 12px; }
  button, input, select { font: inherit; color: inherit; }
  button.el { background: var(--surface); border: 0.5px solid var(--line); border-radius: 6px; padding: 3px 10px; cursor: pointer; font-size: var(--text-sm, calc(var(--app-font-scale, 1) * 0.75rem)); }
  button.el.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); font-weight: 500; }
  button.el.plain { background: transparent; border: 0; padding: 0 2px; text-align: left; }
  button.el.dim { background: transparent; color: var(--dim); }
  button.el:hover { filter: brightness(1.08); }
  input, select { background: var(--surface); border: 0.5px solid var(--line); border-radius: 6px; padding: 3px 8px; font-size: var(--text-sm, calc(var(--app-font-scale, 1) * 0.75rem)); }
  form.input { display: flex; gap: 6px; }
  form.input input { flex: 1; }
  .Text { white-space: pre-wrap; }
  .Text.trunc { white-space: pre; overflow: hidden; text-overflow: ellipsis; display: block; }
  pre { background: var(--surface); border: 0.5px solid var(--line); border-radius: 8px; padding: 8px 10px; margin: 0; white-space: pre-wrap; font-family: var(--font-mono, ui-monospace, SFMono-Regular, Consolas, monospace); font-size: var(--text-sm, calc(var(--app-font-scale, 1) * 0.75rem)); }
  .md p, .md ul, .md ol, .md h1, .md h2, .md h3 { margin: 4px 0; }
  .md h1 { font-size: var(--text-lg, calc(var(--app-font-scale, 1) * 1rem)); font-weight: 600; }
  .md h2 { font-size: var(--text-base, calc(var(--app-font-scale, 1) * 0.875rem)); font-weight: 600; }
  .md h3 { font-size: var(--text-compact, calc(var(--app-font-scale, 1) * 0.8125rem)); font-weight: 600; }
  .md code { background: var(--surface); border: 0.5px solid var(--line); padding: 0 4px; border-radius: 4px; font-family: var(--font-mono, ui-monospace, SFMono-Regular, Consolas, monospace); font-size: 0.92em; }
  .error { color: var(--red); }
</style>
</head>
<body>
<header id="commands" hidden></header>
<div id="strips"></div>
<nav id="tabs" hidden></nav>
<main id="pane"><div class="empty">Connecting…</div></main>
<footer id="status"></footer>
<div id="toasts"></div>
<script src="/ui-draw.js"></script>
<script src="/ui.js"></script>
</body>
</html>
